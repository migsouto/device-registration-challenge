version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devicedb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devicedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - device-network

  # DeviceRegistrationAPI
  device-registration-api:
    build:
      context: ./DeviceRegistrationAPI
      dockerfile: Dockerfile
    container_name: device-registration-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/devicedb
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - device-network
    restart: unless-stopped

  # StatisticsAPI
  statistics-api:
    build:
      context: ./StatisticsAPI
      dockerfile: Dockerfile
    container_name: statistics-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/devicedb
      DEVICE_API_URL: http://device-registration-api:8001
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - device-registration-api
    networks:
      - device-network
    restart: unless-stopped

networks:
  device-network:
    driver: bridge

volumes:
  postgres_data:
  